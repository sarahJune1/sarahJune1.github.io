{{ define "main" }}

<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}
    <div class="page-description">
      {{ . }}
    </div>
  {{ end }}
</header>

{{ $pages := .Pages }}

<!-- Single project -->
{{ if eq (len $pages) 1 }}

<section class="projects-featured">
    {{ range $pages }}
      <article class="post-single projects-featured-card">
        <div class="post-content">
          {{ .Content }}
        </div>
      </article>
    {{ end }}
  </section>

{{ else }}

  {{/* Multiple projects → normal list */}}
  <div class="posts">
    {{ range $pages }}
      <article class="post-entry">
        <header class="entry-header">
          <h2 class="entry-title">
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </h2>
        </header>
        <div class="entry-content">
          {{ .Summary }}
        </div>
      </article>
    {{ end }}
  </div>

{{ end }}

{{ end }}
